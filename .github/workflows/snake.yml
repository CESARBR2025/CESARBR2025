name: Generate Contribution Snake

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs (neon palette)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=%2338BDF8&color_dots=%230B1120,%231e3a5f,%230891b2,%2322D3EE,%237C3AED
            dist/snake-light.svg?color_snake=%230EA5E9&color_dots=%23F1F5F9,%23C7D2FE,%23818CF8,%237C3AED,%234F46E5

      - name: Push generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
